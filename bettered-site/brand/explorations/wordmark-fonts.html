<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BetterEd wordmark: font comparison</title>
<style>
  /* Exploration only. The locked brand (v2.2) sets the wordmark in Source Serif 4. */
  body { margin: 0; padding: 32px 24px 64px; background: #fff; color: #0B1F3A; font-family: Arial, Helvetica, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #4F5B6D; font-size: 14px; margin: 0 0 28px; max-width: 70ch; line-height: 1.5; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 0; border-top: 1px solid #0B1F3A; }
  .tile { padding: 28px 24px 32px; border-bottom: 1px solid rgba(11,31,58,.14); border-right: 1px solid rgba(11,31,58,.14); }
  .tile.dark { background: #0B1F3A; color: #fff; }
  .label { font: 600 11px/1.3 Arial, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: #1A5FB4; margin: 0 0 22px; }
  .dark .label { color: #FFC20E; }
  .warn { display: none; font: 12px/1.4 Arial, sans-serif; color: #B23A1C; margin: 14px 0 0; }
  .wm { display: inline-block; white-space: nowrap; line-height: 1; }
  .wm .name { display: block; font-size: 72px; letter-spacing: -.01em; }
  .wm .sol { display: block; font-size: 17px; margin-top: 12px; white-space: nowrap; }
  .arial .wm { font-family: Arial, "Liberation Sans", sans-serif; }
  .helv .wm { font-family: "Helvetica Neue", "HelveticaNeue", "Liberation Sans", sans-serif; }
  .times .wm { font-family: "Times New Roman", Times, "Liberation Serif", serif; }
  .bold .name, .bold .sol { font-weight: 700; }
  .reg .name { font-weight: 400; } .reg .sol { font-weight: 400; }
</style>
</head>
<body>
<h1>BetterEd wordmark: font comparison</h1>
<p class="sub">Wording only. "SOLUTIONS" is spaced to run the full width of "BetterEd", edge to edge. Each tile uses the font installed on the computer showing this page; a red note appears if that font isn't installed.</p>
<div class="grid" id="grid"></div>
<script>
(function () {
  var fonts = [['arial', 'Arial', 'Arial'], ['helv', 'Helvetica Neue', 'Helvetica Neue'], ['times', 'Times New Roman', 'Times New Roman']];
  var grid = document.getElementById('grid');
  [['bold', 'Bold', ''], ['reg', 'Regular', ''], ['bold', 'Bold, on Navy', 'dark']].forEach(function (w) {
    fonts.forEach(function (f) {
      var t = document.createElement('div');
      t.className = 'tile ' + f[0] + ' ' + w[0] + ' ' + w[2];
      t.innerHTML = '<p class="label">' + f[1] + ' · ' + w[1] + '</p><div class="wm"><span class="name">BetterEd</span><span class="sol">SOLUTIONS</span></div><p class="warn">' + f[1] + ' is not installed on this computer, so a stand-in is shown.</p>';
      t.setAttribute('data-font', f[2]);
      grid.appendChild(t);
    });
  });
  function fit() {
    document.querySelectorAll('.tile').forEach(function (t) {
      var name = t.querySelector('.name'), sol = t.querySelector('.sol');
      sol.style.letterSpacing = '0px'; sol.style.marginRight = '0px';
      var r = document.createRange(); r.selectNodeContents(name); var W = r.getBoundingClientRect().width;
      r.selectNodeContents(sol); var w = r.getBoundingClientRect().width;
      var gap = (W - w) / (sol.textContent.length - 1);
      sol.style.letterSpacing = gap + 'px'; sol.style.marginRight = (-gap) + 'px'; // no trailing space after the last letter
      var f = t.getAttribute('data-font');
      if (document.fonts && document.fonts.check) t.querySelector('.warn').style.display = document.fonts.check('72px "' + f + '"') ? 'none' : 'block';
    });
  }
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(fit);
  window.addEventListener('resize', fit);
})();
</script>
</body>
</html>
